name: DizyTV modern dashboard source checks

on:
  pull_request:
    paths:
      - 'dizytv/desktop.py'
      - 'dizytv/desktop_dashboard.py'
      - 'tests/test_modern_dashboard.py'
      - 'android/app/src/main/java/dev/dizygotic/dizytv/MainActivity.kt'
      - '.github/workflows/modern-dashboard-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-source:
    name: Qt desktop source and legacy UI regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Qt headless support
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source and tests
        run: python -m compileall -q dizytv tests
      - name: Verify dashboard and existing desktop features
        run: |
          timeout --signal=TERM --kill-after=5s 180s python -m unittest discover -s tests -p 'test_modern_dashboard.py' -v
          timeout --signal=TERM --kill-after=5s 360s python -m unittest discover -s tests -p 'test_desktop.py' -v

  android-source:
    name: Android JVM tests (no APK assembly)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Kotlin and run Android unit tests without packaging
        run: gradle -p android testDebugUnitTest --console=plain
