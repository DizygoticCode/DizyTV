name: DizyTV Source QA
on:
  push:
    branches:
      - wip/complete-dependency-gates
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dizytv-source-only-qa
  cancel-in-progress: true
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt headless runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - name: Install test packages
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q dizytv scripts tests
      - name: Run each source suite with an independent hang timeout
        shell: bash
        run: |
          set -euo pipefail
          for filename in tests/test_*.py; do
            suite="${filename##*/}"
            echo "::group::${suite}"
            timeout --signal=TERM --kill-after=5s 50s python -m unittest discover -s tests -p "${suite}" -v
            echo "::endgroup::"
          done
