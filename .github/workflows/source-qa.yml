name: DizyTV Source QA
on:
  push:
    branches:
      - wip/complete-dependency-gates
  pull_request:
    paths:
      - 'dizytv/**'
      - 'android/**'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dizytv-source-only-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt headless runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - name: Install test packages
        run: python -m pip install -r requirements.txt
      - name: Validate version metadata
        run: python scripts/check_release_metadata.py
      - name: Validate Python syntax
        run: python -m compileall -q dizytv scripts tests
      - name: Run each source suite with an independent hang timeout
        shell: bash
        run: |
          set -uo pipefail
          errors=0
          for filename in tests/test_*.py; do
            suite="${filename##*/}"
            echo "::group::${suite}"
            budget=80
            if [[ "${suite}" == "test_desktop.py" ]]; then budget=360; fi
            if ! timeout --signal=TERM --kill-after=5s "${budget}s" python -m unittest discover -s tests -p "${suite}" -v; then
              echo "::error::Suite ${suite} failed or exceeded ${budget}s"
              errors=$((errors+1))
            fi
            echo "::endgroup::"
          done
          if (( errors != 0 )); then
            echo "${errors} test suites failed" >&2
            exit 1
          fi

  android-unit-tests:
    name: Android source unit tests (no installer build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and run JVM unit tests, without building APKs
        run: gradle -p android testDebugUnitTest --console=plain
