name: Native alpha builds
on:
  push:
    branches: [main, build/native-apps]
    paths: ['dizytv/**', 'android/**', 'assets/**', 'tests/**', 'scripts/**', 'requirements.txt', 'pyproject.toml', 'THIRD-PARTY-NOTICES.md', '.github/workflows/native-builds.yml']
  pull_request:
    paths: ['dizytv/**', 'android/**', 'assets/**', 'tests/**', 'scripts/**', 'requirements.txt', 'pyproject.toml', 'THIRD-PARTY-NOTICES.md', '.github/workflows/native-builds.yml']
  workflow_dispatch:
permissions:
  contents: read
# Multiple small PR commits used to queue dozens of redundant native macOS
# builds. Keep only the newest pull-request build; never cancel a main release.
concurrency:
  group: native-alpha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  android:
    name: Android / universal APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Contract tests, Android lint and APK build
        run: gradle -p android testDebugUnitTest lintDebug assembleDebug --console=plain
      - name: Verify APK signature and checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/DizyTV-0.1.16-alpha-android-universal-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DizyTV-0.1.16-alpha-android
          path: dist/
          if-no-files-found: error
          retention-days: 30
  desktop:
    name: Desktop / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Core, recorder and native UI tests
        run: python -m unittest discover -s tests -v
      - name: Native source startup
        run: python -m dizytv --smoke-test --data-dir smoke-data
      - name: Stage checksum-pinned Windows speech assets
        if: runner.os == 'Windows'
        run: python scripts/stage_windows_speech.py
      - name: Package native application
        run: python scripts/build_desktop.py
      - name: Windows packaged startup and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process dist/DizyTV/DizyTV.exe -ArgumentList '--smoke-test','--data-dir','smoke-packaged' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Packaged app failed to launch' }
          # The Windows installer must ship both dependencies, even when the CI
          # host already has an FFmpeg executable installed.
          $speech = 'dist/DizyTV/_internal/speech'
          $ffmpeg = Join-Path $speech 'ffmpeg.exe'
          if (-not (Test-Path $ffmpeg)) { throw 'FFmpeg was not bundled' }
          if (-not (Test-Path (Join-Path $speech 'vosk-model-small-en-us-0.15/am'))) { throw 'Vosk acoustic model was not bundled' }
          if (-not (Test-Path (Join-Path $speech 'vosk-model-small-en-us-0.15/conf'))) { throw 'Vosk model configuration was not bundled' }
          & $ffmpeg -version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Bundled FFmpeg executable failed to start' }

          # Regression: 0.1.1-style hidden recorder keeps the packaged EXE open.
          # The upgrade helper must refuse an active job and stop only an idle worker.
          $workerRoot = Join-Path $PWD 'smoke-upgrade'
          $exePath = (Resolve-Path dist/DizyTV/DizyTV.exe).Path
          New-Item -Path $workerRoot -ItemType Directory -Force | Out-Null
          $worker = Start-Process -FilePath $exePath -ArgumentList @('--worker','--data-dir', ('"' + $workerRoot + '"')) -PassThru
          Start-Sleep -Seconds 2
          $worker.Refresh()
          if ($worker.HasExited) { throw 'Recorder worker did not stay running' }
          python -c "import time; from dizytv.storage import Store; from dizytv.core import make_job; s=Store(r'$workerRoot'); j=make_job('a'*40,'Future',int(time.time())+3600,int(time.time())+3700,0,0); j['status']='recording'; s.update(lambda state: state['jobs'].append(j))"
          & powershell -NoProfile -NonInteractive -File scripts/windows-stop-worker.ps1 -InstalledExePath $exePath -DataDirectory $workerRoot
          if ($LASTEXITCODE -ne 2) { throw 'Busy worker was not protected by installer check' }
          $worker.Refresh()
          if ($worker.HasExited) { throw 'Busy recorder must not be stopped' }
          python -c "from dizytv.storage import Store; Store(r'$workerRoot').update(lambda s: s['jobs'][0].update(status='queued'))"
          & powershell -NoProfile -NonInteractive -File scripts/windows-stop-worker.ps1 -InstalledExePath $exePath -DataDirectory $workerRoot
          if ($LASTEXITCODE -ne 0) { throw 'Idle recorder could not be stopped' }
          $worker.WaitForExit(8000) | Out-Null
          $worker.Refresh()
          if (-not $worker.HasExited) { throw 'Recorder still holds installation executable' }
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

          # End-to-end regression: a previously installed DizyTV worker keeps
          # app DLLs open. Test the *built installer*, not only the helper.
          $target = Join-Path $env:RUNNER_TEMP 'DizyTV Upgrade Directory'
          $data = Join-Path $env:RUNNER_TEMP 'DizyTV Upgrade Data'
          New-Item -ItemType Directory -Force -Path $target,$data | Out-Null
          Copy-Item 'dist/DizyTV/*' -Destination $target -Recurse -Force
          $app = Join-Path $target 'DizyTV.exe'
          $note = Join-Path $target 'THIRD-PARTY-NOTICES.md'
          Set-Content -LiteralPath $note -Value 'STALE-INSTALLED-FILE'
          $old = Start-Process -FilePath $app -ArgumentList @('--worker','--data-dir', ('"' + $data + '"')) -PassThru
          try {
            Start-Sleep -Seconds 3
            $old.Refresh()
            if ($old.HasExited) { throw 'Old worker did not start' }
            $installer = (Resolve-Path 'dist/DizyTV-Setup-0.1.16-alpha-windows-x64.exe').Path
            $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="' + $target + '"')) -PassThru -Wait
            if ($install.ExitCode -ne 0) { throw "Upgrade failed with running idle worker: exit $($install.ExitCode)" }
            $old.Refresh()
            if (-not $old.HasExited) { throw 'Old worker still running after upgrade' }
            if (-not (Test-Path -LiteralPath (Join-Path $target '_internal/libcrypto-3.dll'))) { throw 'DLL not installed' }
            # Prove the *compiled Inno installer* copied the speech components,
            # rather than only testing PyInstaller's uninstalled dist directory.
            $installedSpeech = Join-Path $target '_internal/speech'
            $installedFFmpeg = Join-Path $installedSpeech 'ffmpeg.exe'
            if (-not (Test-Path -LiteralPath $installedFFmpeg)) { throw 'Installer omitted bundled FFmpeg' }
            if (-not (Test-Path -LiteralPath (Join-Path $installedSpeech 'vosk-model-small-en-us-0.15/am'))) { throw 'Installer omitted bundled Vosk acoustic model' }
            if (-not (Test-Path -LiteralPath (Join-Path $installedSpeech 'vosk-model-small-en-us-0.15/conf'))) { throw 'Installer omitted bundled Vosk model config' }
            & $installedFFmpeg -version | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Installed FFmpeg failed execution' }
            if ((Get-Content -LiteralPath $note -Raw) -match 'STALE-INSTALLED-FILE') { throw 'Old file was not replaced' }
            $run = Start-Process -FilePath $app -ArgumentList @('--smoke-test','--data-dir',('"' + $data + '"')) -PassThru -Wait
            if ($run.ExitCode -ne 0) { throw 'Upgraded binary failed startup' }
          }
          finally {
            $old.Refresh()
            if (-not $old.HasExited) { Stop-Process -Id $old.Id -Force -ErrorAction SilentlyContinue }
          }
          Get-FileHash dist/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
      - name: macOS packaged startup and package inspection
        if: runner.os == 'macOS'
        run: |
          dist/DizyTV.app/Contents/MacOS/DizyTV --smoke-test --data-dir smoke-packaged
          # Validate the exact release filename in each native build, not only
          # in publish-alpha after waiting for every other platform to finish.
          test -s "dist/DizyTV-0.1.16-alpha-${{ matrix.target }}.pkg"
          pkgutil --payload-files "dist/DizyTV-0.1.16-alpha-${{ matrix.target }}.pkg"
          codesign --verify --deep --strict dist/DizyTV.app
      - uses: actions/upload-artifact@v4
        with:
          name: DizyTV-0.1.16-alpha-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.pkg
            dist/*.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  package-linux:
    name: Ubuntu 24.04 x64 • .deb
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux libVLC, Qt runtime libraries, and Debian packager
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc5 vlc-plugin-base vlc-plugin-video-output libgl1 libxcb-cursor0 libxkbcommon-x11-0 dpkg-dev
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Full unit and desktop UI tests
        run: python -m unittest discover -s tests -v
      - name: Source smoke startup
        run: python -m dizytv --smoke-test --data-dir smoke-source
      - name: Build native Linux executable
        run: python scripts/build_desktop.py
      - name: Package .deb
        run: python scripts/package_linux.py
      - name: Verify packaged app and .deb metadata
        run: |
          test -s dist/DizyTV-0.1.16-alpha-linux-amd64.deb
          dpkg-deb --contents dist/DizyTV-0.1.16-alpha-linux-amd64.deb | grep -F '/opt/dizytv/DizyTV'
          dpkg-deb --field dist/DizyTV-0.1.16-alpha-linux-amd64.deb
          mkdir smoke-installed
          dpkg-deb --extract dist/DizyTV-0.1.16-alpha-linux-amd64.deb smoke-installed
          test -x smoke-installed/usr/bin/dizytv
          test -f smoke-installed/usr/share/applications/dizytv.desktop
          if find smoke-installed/opt/dizytv -name 'libvlc*.so*' -print -quit | grep -q .; then
            echo 'Linux package must use the system libVLC libraries and matching plugins' >&2
            exit 1
          fi
          smoke-installed/opt/dizytv/DizyTV --smoke-test --data-dir smoke-packaged
          sha256sum dist/DizyTV-0.1.16-alpha-linux-amd64.deb > dist/DizyTV-0.1.16-alpha-linux-amd64.deb.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DizyTV-0.1.16-alpha-linux-amd64
          path: |
            dist/DizyTV-0.1.16-alpha-linux-amd64.deb
            dist/DizyTV-0.1.16-alpha-linux-amd64.deb.sha256
          if-no-files-found: error
          retention-days: 30

  publish-alpha:
    name: Publish direct installer downloads
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, desktop, package-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified installers
        uses: actions/download-artifact@v4
        with:
          pattern: DizyTV-0.1.16-alpha-*
          path: native-artifacts
      - name: Collect native files and generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find native-artifacts -type f \( -name '*.exe' -o -name '*.apk' -o -name '*.pkg' -o -name '*.deb' \) -exec cp -- '{}' release/ \;
          for asset in \
            DizyTV-Setup-0.1.16-alpha-windows-x64.exe \
            DizyTV-0.1.16-alpha-android-universal-debug.apk \
            DizyTV-0.1.16-alpha-macos-arm64.pkg \
            DizyTV-0.1.16-alpha-macos-x86_64.pkg \
            DizyTV-0.1.16-alpha-linux-amd64.deb; do
            test -s "release/$asset" || { echo "Missing installer: $asset" >&2; exit 1; }
          done
          test "$(find release -type f | wc -l)" -eq 5
          (cd release && sha256sum *.exe *.apk *.pkg *.deb > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
      - name: Publish versioned pre-release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.16-alpha --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.1.16-alpha already exists; refusing to silently replace published binaries.'
            exit 0
          fi
          gh release create v0.1.16-alpha release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'DizyTV 0.1.16 alpha — native Linux, diagnostics and channel management' \
            --prerelease \
          --notes 'DizyTV 0.1.16 alpha adds an experimental Ubuntu/Debian amd64 .deb alongside native Windows x64 EXE, macOS arm64/Intel PKGs and the Android Kotlin/Gradle debug APK. Shared desktop changes include a local Tools → System usage panel (CPU/RAM and VLC counters), progressive on-demand HTTP health scanning with progress/stop and conservative rate-limit handling, reversible duplicate-channel candidate management with previous per-device HTTP status, a one-click UK FAST playlist plus XMLTV pairing, and a standard 24/7 category without an extra shortcut button. Direct HTTP/HLS playback gains a manually adjustable buffer while existing Ace Stream playback paths are retained. The Linux build uses installed libVLC, a separately installed native Ace start-engine, and opt-in local FFmpeg/Vosk. Native CI validates package creation, startup and unit tests; DRM, geo access, individual third-party feeds, P2P peers and real-device decoding still need manual verification. All five native artifacts and checksums are published only after the five CI jobs pass; none of these apps bundles an Ace engine or a guaranteed stream catalogue. Android remains a separate Kotlin/Gradle implementation and is not asserted to have desktop-only features.'
