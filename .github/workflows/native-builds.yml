name: Native alpha builds
on:
  push:
    branches: [main, build/native-apps]
    paths: ['dizytv/**', 'android/**', 'assets/**', 'tests/**', 'scripts/**', 'requirements.txt', 'pyproject.toml', 'THIRD-PARTY-NOTICES.md', '.github/workflows/native-builds.yml']
  pull_request:
    paths: ['dizytv/**', 'android/**', 'assets/**', 'tests/**', 'scripts/**', 'requirements.txt', 'pyproject.toml', 'THIRD-PARTY-NOTICES.md', '.github/workflows/native-builds.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Android / universal APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Contract tests, Android lint and APK build
        run: gradle -p android testDebugUnitTest lintDebug assembleDebug --console=plain
      - name: Verify APK signature and checksum
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/DizyTV-0.1.0-alpha-android-universal-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DizyTV-0.1.0-alpha-android
          path: dist/
          if-no-files-found: error
          retention-days: 30
  desktop:
    name: Desktop / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Core, recorder and native UI tests
        run: python -m unittest discover -s tests -v
      - name: Native source startup
        run: python -m dizytv --smoke-test --data-dir smoke-data
      - name: Package native application
        run: python scripts/build_desktop.py
      - name: Windows packaged startup and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process dist/DizyTV/DizyTV.exe -ArgumentList '--smoke-test','--data-dir','smoke-packaged' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Packaged app failed to launch' }
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' scripts/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Get-FileHash dist/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
      - name: macOS packaged startup and package inspection
        if: runner.os == 'macOS'
        run: |
          dist/DizyTV.app/Contents/MacOS/DizyTV --smoke-test --data-dir smoke-packaged
          pkgutil --payload-files dist/*.pkg
          codesign --verify --deep --strict dist/DizyTV.app
      - uses: actions/upload-artifact@v4
        with:
          name: DizyTV-0.1.0-alpha-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.pkg
            dist/*.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  publish-alpha:
    name: Publish direct installer downloads
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified installers
        uses: actions/download-artifact@v4
        with:
          pattern: DizyTV-0.1.0-alpha-*
          path: native-artifacts
      - name: Collect native files and generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find native-artifacts -type f \( -name '*.exe' -o -name '*.apk' -o -name '*.pkg' \) -exec cp -- '{}' release/ \;
          for asset in \
            DizyTV-Setup-0.1.0-alpha-windows-x64.exe \
            DizyTV-0.1.0-alpha-android-universal-debug.apk \
            DizyTV-0.1.0-alpha-macos-arm64.pkg \
            DizyTV-0.1.0-alpha-macos-x86_64.pkg; do
            test -s "release/$asset" || { echo "Missing installer: $asset" >&2; exit 1; }
          done
          test "$(find release -type f | wc -l)" -eq 4
          (cd release && sha256sum *.exe *.apk *.pkg > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
      - name: Publish versioned pre-release once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0-alpha --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.1.0-alpha already exists; refusing to silently replace published binaries.'
            exit 0
          fi
          gh release create v0.1.0-alpha release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'DizyTV 0.1.0 alpha — device testing' \
            --prerelease \
            --notes 'Early device-testing builds, not a stable release. Installers are direct .exe/.apk/.pkg files (no Actions ZIP and no GitHub login needed). Windows and macOS packages are not publicly trusted-signed/notarized, and the Android APK uses an ephemeral CI debug signing key; browser or operating-system warnings may still occur. For Android upgrades, uninstalling the previous build may be necessary (back up app settings first). Ace Stream engine and desktop VLC are separate prerequisites. Verify downloads using SHA256SUMS.txt. See the README and docs/DISTRIBUTION.md for requirements and known limitations.'
